name: Release

# A tag vX.Y.Z builds Panowww.dmg (Apple Silicon) and Panowww-setup.exe (x64)
# and attaches them to a draft GitHub Release. Publishing stays manual
# (docs/release.md).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    permissions:
      contents: write # create the draft Release and upload its files
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # The toolchain pinned in rust-toolchain.toml installs on first use.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: install UI dependencies
        run: pnpm install --frozen-lockfile

      # Our certificate is self-signed (no Apple Developer account), so Tauri's
      # APPLE_CERTIFICATE import does not apply: we import it into a temporary
      # keychain ourselves and trust it for code signing, without which codesign
      # answers "no identity found". The stable certificate keeps the app's
      # designated requirement, so Accessibility and Screen Recording grants
      # survive updates.
      - name: import the signing certificate
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          keychain="$RUNNER_TEMP/panowww-signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          # Put the keychain first in the search list, keeping the others.
          read -ra others <<< "$(security list-keychains -d user | tr -d '"')"
          security list-keychains -d user -s "$keychain" "${others[@]}"
          security find-certificate -c "$IDENTITY" -p "$keychain" > "$RUNNER_TEMP/signing.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/signing.pem"
          rm "$RUNNER_TEMP/signing.p12"
          security find-identity -v -p codesigning "$keychain"

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '' }}
        with:
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_name }}
          releaseName: Panowww ${{ github.ref_name }}
          releaseDraft: true
          # 0.x and -beta versions are pre-releases (docs/release.md).
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          generateReleaseNotes: true
          # Panowww.dmg and Panowww-setup.exe, the names the README links to.
          releaseAssetNamePattern: "[name][setup][ext]"
          uploadUpdaterJson: false

      # The designated requirement must name our certificate, not a cdhash:
      # it is what keeps the permissions across updates (issue 21 acceptance).
      - name: show the designated requirement
        if: runner.os == 'macOS'
        run: |
          mount=$(hdiutil attach -nobrowse -readonly target/release/bundle/dmg/*.dmg | tail -1 | cut -f3)
          codesign -d -r- "$mount/Panowww.app"
          codesign --verify --deep --strict "$mount/Panowww.app"
          hdiutil detach "$mount"
