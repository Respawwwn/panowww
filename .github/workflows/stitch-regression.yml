name: Stitch regression

# The real Sessions of Respawwwn/panowww-stitch-fixtures, stitched again
# and held to their approved Panoramas (crates/store/tests/real_sessions.rs).
# Runs apart from CI: the fixtures weigh half a gigabyte and only the Stitch
# can change the result.
on:
  push:
    branches: [main]
    paths:
      - "crates/stitch/**"
      - "crates/store/**"
      - "Cargo.lock"
      - ".github/workflows/stitch-regression.yml"
  pull_request:
    paths:
      - "crates/stitch/**"
      - "crates/store/**"
      - "Cargo.lock"
      - ".github/workflows/stitch-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  real-sessions:
    name: real Sessions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: fetch the fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Respawwwn/panowww-stitch-fixtures
          path: fixtures
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      - name: stitch the real Sessions
        env:
          PANOWWW_STITCH_FIXTURES: ${{ github.workspace }}/fixtures
        run: cargo nextest run --release -p panowww-store --test real_sessions --run-ignored only --no-tests=fail
