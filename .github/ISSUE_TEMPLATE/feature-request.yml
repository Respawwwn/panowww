name: Feature request
description: An idea to make Panowww better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The panorama, the game or the step where Panowww gets in your way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How Panowww could help. Rough is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How you do it today
      description: Workarounds, other tools.
