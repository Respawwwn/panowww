[package]
name = "panowww-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Panowww: 360° panorama source Shots from video games"

[lib]
name = "panowww_app"

[[bin]]
name = "panowww"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
panowww-capture = { version = "0.0.1", path = "../crates/capture" }
panowww-core = { path = "../crates/core" }
panowww-input = { version = "0.0.1", path = "../crates/input" }
panowww-store = { version = "0.0.1", path = "../crates/store" }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12", features = ["no-serde-warnings"] }
ureq = { version = "3", features = ["json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = "2.1"

[dev-dependencies]
panowww-core = { path = "../crates/core", features = ["test-support"] }
tauri = { version = "2", features = ["test"] }
tempfile = "3"
