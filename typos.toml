[files]
extend-exclude = [
    "target/",
    "node_modules/",
    "pnpm-lock.yaml",
    "ui/dist/",
    "ui/src/lib/generated/",
    "app/gen/",
    "app/icons/",
    "spike/",
    "prototype/",
    ".wayfinder/",
    ".idea/",
]

[default]
# Short commit hashes cited in the manual tests (6615ded, …).
extend-ignore-re = ["\\b[0-9a-f]{7}\\b"]

[default.extend-words]
# Brand names: Respawwwn and Panowww.
# A crate name cited in the research notes.
scap = "scap"

[default.extend-identifiers]
# The wizard library (scripts/signing-certificate.sh) is copied verbatim.
NAMEs = "NAMEs"
