# cargo-deny: licences, advisories, bans and sources of every dependency.

[graph]
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is pulled in by Tauri; unmaintained, not a vulnerability" },
    { id = "RUSTSEC-2026-0370", reason = "zbus_names: Linux-only transitive dependency of tauri-plugin-opener; unmaintained, not a vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "zvariant: same as above" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: same as above" },
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Zlib",
]
unused-allowed-license = "allow"

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
