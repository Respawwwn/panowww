[package]
name = "panowww-stitch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nalgebra = "0.34"
panowww-core = { path = "../core" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
ts-rs = { version = "12", features = ["no-serde-warnings"] }

[dev-dependencies]
# The unit tests use the synthetic Session of this very crate.
panowww-stitch = { path = ".", features = ["test-support"] }
insta = "1"

[features]
# The synthetic Session: a procedural equirectangular rendered into Shots
# with a known grid and known perturbations, and an in-memory ShotSource.
test-support = []
