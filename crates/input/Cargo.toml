[package]
name = "panowww-input"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
panowww-core = { path = "../core" }
tracing = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-application-services = { version = "0.3", features = ["HIServices", "AXUIElement"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGEvent", "CGEventTypes", "CGEventSource", "CGRemoteOperation"] }

[target.'cfg(target_os = "windows")'.dependencies]
vigem-client = "0.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# The turn_test example drives the Runner with the core fakes for the rest.
panowww-core = { path = "../core", features = ["test-support"] }
